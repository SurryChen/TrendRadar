name: Build and Push Docker Images

on:
  push:
    branches: [codex/web-admin]
    paths:
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - 'docker/Dockerfile.web'
      - 'docker/*web*'
      - 'trendradar/**'
      - 'mcp_server/**'
      - 'config/**'
      - 'docs/**'
      - 'tests/test_web_admin.py'
      - 'pyproject.toml'
      - 'uv.lock'
    tags:
      - "v*" # 主项目版本
      - "mcp-v*" # MCP 版本
  workflow_dispatch:
    inputs:
      image:
        description: "选择要构建的镜像"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - crawler
          - mcp

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io

jobs:
  verify-web:
    if: github.repository_owner != 'sansan0' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'all') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/web-admin'))
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose -f docker/docker-compose-web.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          load: true
          tags: trendradar-web:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web-test
      - name: Test authenticated backend inside the image
        run: >-
          docker run --rm --entrypoint python
          --mount type=bind,source="$PWD/tests",target=/app/tests,readonly
          trendradar-web:test
          -m unittest discover -s tests -p test_web_admin.py -v
      - name: Test initialization, HTTP login and volume persistence
        run: python3 docker/test_web_image.py trendradar-web:test

  publish-web:
    needs: verify-web
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trendradar-web" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TrendRadar Web Admin
          cache-from: |
            type=gha,scope=web
            type=gha,scope=web-test
          cache-to: type=gha,mode=max,scope=web

  build-crawler:
    runs-on: ubuntu-latest
    # 条件：v* 标签（排除 mcp-v*）或手动触发选择 all/crawler
    if: |
      !(github.repository_owner != 'sansan0' && github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'all') && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/mcp-v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.image == 'all' || github.event.inputs.image == 'crawler')))

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: wantcat/trendradar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mcp:
    runs-on: ubuntu-latest
    # 条件：mcp-v* 标签 或手动触发选择 all/mcp
    if: |
      !(github.repository_owner != 'sansan0' && github.event_name == 'workflow_dispatch' && github.event.inputs.image == 'all') && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp-v')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.image == 'all' || github.event.inputs.image == 'mcp')))

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/mcp-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/mcp-v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "major_minor=$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "major_minor=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: wantcat/trendradar-mcp
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
