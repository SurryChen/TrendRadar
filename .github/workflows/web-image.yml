name: Build Web Admin Image

on:
  push:
    branches: [codex/web-admin]
    paths:
      - '.github/workflows/web-image.yml'
      - '.dockerignore'
      - 'docker/Dockerfile.web'
      - 'docker/*web*'
      - 'trendradar/**'
      - 'mcp_server/**'
      - 'config/**'
      - 'docs/**'
      - 'tests/test_web_admin.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose -f docker/docker-compose-web.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          load: true
          tags: trendradar-web:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web-test
      - name: Test authenticated backend inside the image
        run: >-
          docker run --rm --entrypoint python
          --mount type=bind,source="$PWD/tests",target=/app/tests,readonly
          trendradar-web:test
          -m unittest discover -s tests -p test_web_admin.py -v
      - name: Test initialization, HTTP login and volume persistence
        run: python3 docker/test_web_image.py trendradar-web:test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trendradar-web" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TrendRadar Web Admin
          cache-from: |
            type=gha,scope=web
            type=gha,scope=web-test
          cache-to: type=gha,mode=max,scope=web
